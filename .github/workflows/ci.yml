name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Desktop (Linux) viewer: fmt + clippy + build + test, plus the Linux-only
  # indexer crate. pdfium is not needed — pdfium-render binds it at runtime, and
  # the tests only exercise the DB loader / index parser, not page rendering.
  linux:
    name: Linux (viewer + indexer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build-time deps for the Slint winit/femtovg backend (fontconfig).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt (viewer)
        run: cargo fmt --check
      - name: clippy (viewer)
        run: cargo clippy --all-targets -- -D warnings
      - name: build (viewer)
        run: cargo build --all-targets
      - name: test (viewer)
        run: cargo test

      - name: rustfmt (indexer)
        working-directory: indexer
        run: cargo fmt --check
      - name: clippy (indexer)
        working-directory: indexer
        run: cargo clippy --all-targets -- -D warnings
      - name: build + test (indexer)
        working-directory: indexer
        run: cargo test

  # Android: cross-compile the native cdylib for arm64-v8a via cargo-ndk. This
  # is the meaningful compile check; gradle packaging/signing is done on-device
  # (see docs/RELEASE_HOWTO.md) and is not reproduced here.
  android:
    name: Android (arm64-v8a .so)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      # Slint's android-activity build.rs compiles a small Java helper and dexes
      # it, using the `android-build` crate to locate android.jar / d8.jar. That
      # crate honors the runner's preset ANDROID_PLATFORM / ANDROID_SDK_EXTENSION
      # env, which resolve to a platform dir with no android.jar, so it fails
      # with "No Android platforms found" — even though the SDK platforms are
      # preinstalled. android_jar()/android_d8_jar() check ANDROID_JAR /
      # ANDROID_D8_JAR first, so pin those to concrete files to bypass it.
      - name: Pin android.jar / d8.jar for the Slint android build
        run: |
          set -euo pipefail
          jar=$(find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-*' ! -name '*-ext*' | sort -V | tail -1)/android.jar
          d8=$(find "$ANDROID_HOME/build-tools" -path '*/lib/d8.jar' | sort -V | tail -1)
          test -f "$jar"
          test -f "$d8"
          echo "ANDROID_JAR=$jar" >> "$GITHUB_ENV"
          echo "ANDROID_D8_JAR=$d8" >> "$GITHUB_ENV"

      - name: Point cargo-ndk at the runner's NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # Mirrors build_bundle.sh: Cargo.toml selects the android-activity backend
      # for target_os = "android", so no extra --features is needed.
      - name: Build Android library
        run: cargo ndk -t arm64-v8a build --lib --release

  ios:
    name: iOS (simulator build + device compile)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim, aarch64-apple-ios
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install xcodegen
        run: brew install xcodegen

      - name: clippy (iOS)
        run: cargo clippy --target aarch64-apple-ios-sim --lib -- -D warnings

      - name: Build device arch
        run: cargo build --target aarch64-apple-ios --lib

      # ARCHS is pinned to a concrete simulator arch: a `generic/platform=iOS
      # Simulator` destination leaves $ARCHS as "undefined_arch" for a plain
      # `build`, which build_for_ios_with_cargo.bash can't map to a cargo target.
      - name: Xcode simulator build (unsigned)
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project TuneCall.xcodeproj -scheme TuneCall \
            -sdk iphonesimulator -configuration Debug \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build
