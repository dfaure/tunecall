plugins {
    id 'com.android.application'
}

// Release signing is read from a gitignored keystore.properties at the repo
// root (see docs/RELEASE_SIGNING.md). When it's absent (normal dev checkout),
// release builds fall back to the debug keystore — fine for sideloading, but
// NOT accepted by Google Play.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion = "25.2.9519653"
    compileSdk = 35

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "tunecall-${variant.buildType.name}.apk"
        }
    }

    signingConfigs {
        debug {
            storeFile = file("/data/data/com.termux/files/home/debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
        release {
            if (hasReleaseKeystore) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId = "com.tunecall.app"
        minSdk = 28
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // No Java/Kotlin to shrink (NativeActivity + prebuilt .so), so R8
            // gives almost nothing; leave minify off.
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled = false
            signingConfig = signingConfigs.debug
            packagingOptions {
                doNotStrip '**/*.so'
            }
            debuggable = true
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    namespace = 'com.tunecall.app'
}

dependencies {

}
