# We deliberately do NOT strip the Android release .so in the Rust build. AGP
# extracts its debug symbols into the AAB's server-side symbol file (so Play can
# symbolicate native crash/ANR traces — ndk.debugSymbolLevel in app/build.gradle)
# and then strips the .so it ships to users. Stripping here would throw the
# symbols away before AGP can save them. See build_bundle.sh.

[target.x86_64-pc-windows-msvc]
# Increase default stack size to avoid running out of stack
# space in debug builds. The size matches Linux's default.
rustflags = [
    "-C", "link-arg=/STACK:8000000"
]
[target.aarch64-pc-windows-msvc]
# Increase default stack size to avoid running out of stack
# space in debug builds. The size matches Linux's default.
rustflags = [
    "-C", "link-arg=/STACK:8000000"
]
