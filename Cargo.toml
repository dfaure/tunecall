[package]
name = "tunecall"
version = "1.0.5"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Backend is split per-target below: winit on desktop, android-activity on
# Android. Cargo unions feature sets across the matching target blocks, so the
# correct backend is picked from the build target alone — no extra `--features`
# needed on the command line.
slint = { version = "1.15.1", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg"] }
flexi_logger = "0.31.2"
log = "0.4.27"
anyhow = "1.0.98"
tracing = "0.1"
dirs = "6"
# Reads the per-PDF sibling index databases produced by the indexer (../indexer).
rusqlite = { version = "0.37.0", features = ["bundled"] }
# In-app PDF rendering. Binds to the pdfium shared library dynamically at runtime
# (libpdfium.so / pdfium.dll / libpdfium.dylib), so the build does not need it; see README.md.
# default-features off drops the `image` crate dep: we read RGBA bytes from the bitmap directly.
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "thread_safe"] }
# Downloads the published .db indexes (Reload button) using reqwest, driven on
# Slint's event loop via async-compat. TLS uses rustls with its own bundled CA
# roots (rustls-tls-webpki-roots) so HTTPS works on Android without depending on
# the system OpenSSL / trust store (the cross-build pain that earlier forced
# plain http).
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls-webpki-roots"] }
async-compat = "0.2.4"
futures-util = "0.3.31"
# User-created setlists are persisted as JSON in the data dir (the app's first
# writable user data); everything else is read-only SQLite indexes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop backend (anything that isn't Android): winit.
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.15.1", default-features = false, features = ["backend-winit"] }

# Android-only deps:
# - slint backend: android-activity (Slint's Android backend).
# - jni: a small Java helper (app/src/main/java/com/tunecall/app/Immersive.java)
#   called on the UI thread to toggle immersive fullscreen while the PDF viewer
#   is open (Slint's android backend exposes no fullscreen API). Pinned to the
#   stable 0.21 API, independent of the backend's own jni version.
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.15.1", default-features = false, features = ["backend-android-activity-06"] }
jni = "0.21"

[build-dependencies]
slint-build = "1.15.1"

[lib]
# https://github.com/rust-lang/cargo/issues/12260#issuecomment-2225216175 says this might create trouble on Windows...
# cdylib = Build as a C-compatible dynamic library for Android
# rlib = Build a Rust library for the desktop build
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tunecall"
path = "src/bin/main.rs"
# This allows to skip building the binary on Android (it builds, but it's useless and very slow to build)
required-features = ["with-binary"]

[features]
default = ["with-binary"]
with-binary = []

# Strip symbols on Android: see .cargo/config.toml
