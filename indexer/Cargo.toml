[package]
name = "tunecall-indexer"
version = "0.1.0"
edition = "2024"
description = "Linux-only tool: build a per-PDF song index for TuneCall from a transcribed TOC sidecar"

# Standalone package (NOT part of the tunecall crate / Android build). Build and
# run it from this directory: `cargo run -- --help`.

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
# Only used to read each PDF's page count (to validate --offset / clamp entries).
pdfium-render = "0.8"
