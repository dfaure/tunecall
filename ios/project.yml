# Generate the XCode project with `xcodegen` run from this dir:
#   cd ios && xcodegen generate
# then open TuneCall.xcodeproj, or build headless with xcodebuild (see
# docs / the run steps). The pdfium dylib is fetched automatically at build
# time if missing (see the "Embed pdfium dylib" phase), so no manual
# `./fetch-pdfium.sh ios` step is required first.
#
# Signing is intentionally NOT configured here (this file is committed).
# Simulator builds need no signing. For a device build, supply your team at
# build time instead of committing it, e.g.:
#   xcodebuild ... -destination 'generic/platform=iOS' -allowProvisioningUpdates \
#     DEVELOPMENT_TEAM=XXXXXXXXXX CODE_SIGN_STYLE=Automatic
name: TuneCall
options:
  bundleIdPrefix: fr.davidfaure.tunecall
settings:
  # Slint's build script (build_for_ios_with_cargo.bash) runs cargo from a
  # user script phase; Xcode's default script sandboxing would block it.
  ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  TuneCall:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TuneCall
        # Empty dict = default launch screen (a valid UILaunchScreen is required
        # for full-screen / iPad multitasking).
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # Expose the app's Documents/ folder (which storage.rs uses as pdf_dir on
        # iOS) so users can drop their own PDFs in: UIFileSharingEnabled surfaces
        # it in Finder over USB, LSSupportsOpeningDocumentsInPlace in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # No clang-compiled sources: the executable is produced by cargo and the
    # pdfium dylib is embedded, both via the script phases below.
    sources: []
    postCompileScripts:
      # The Rust executable is produced by cargo, not clang, so a post-compile
      # script builds it and drops it at the path Xcode expects. Run from the
      # repo root (parent of this SRCROOT) so cargo finds Cargo.toml, keeping the
      # vendored bash script byte-for-byte with upstream.
      - name: Build Rust binary with cargo
        script: |
          cd "$SRCROOT/.." && ./ios/build_for_ios_with_cargo.bash tunecall
        outputFileLists: $TARGET_BUILD_DIR/$EXECUTABLE_PATH
      # Embed pdfium in the bundle's Frameworks/ (src/pdf.rs binds to it there at
      # runtime). It's git-ignored and produced by fetch-pdfium.sh, so fetch it if
      # missing rather than silently shipping an app that can't render PDFs; a
      # failed fetch (e.g. offline) aborts the build via `set -e`. The simulator
      # and device need different Mach-O builds, picked here by PLATFORM_NAME. A
      # physical device also rejects an unsigned embedded dylib, so device builds
      # code-sign it with the app's identity (before Xcode seals the bundle).
      - name: Embed pdfium dylib
        script: |
          set -euo pipefail
          case "$PLATFORM_NAME" in
            *simulator) VARIANT=simulator ;;
            *)          VARIANT=device ;;
          esac
          DYLIB="$SRCROOT/libpdfium-$VARIANT.dylib"
          if [ ! -f "$DYLIB" ]; then
            echo "note: $(basename "$DYLIB") missing — running fetch-pdfium.sh ios-$VARIANT"
            "$SRCROOT/../fetch-pdfium.sh" "ios-$VARIANT"
          fi
          DEST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$DEST"
          cp "$DYLIB" "$DEST/libpdfium.dylib"
          if [ "$VARIANT" = device ] && [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$DEST/libpdfium.dylib"
          fi
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libpdfium.dylib
